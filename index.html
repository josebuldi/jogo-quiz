<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Divertido — Perguntas e Respostas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">

    <!-- TELA 1: ESCOLHER MATÉRIA -->
    <section id="tela-inicio" class="tela">
      <h1 class="titulo">🧠 Quiz Divertido</h1>
      <p class="subtitulo">O que você quer estudar hoje?</p>
      <div id="menu-materias" class="grade"></div>
    </section>

    <!-- TELA 2: TABUADA — ESCOLHER NÚMERO -->
    <section id="tela-tabuada" class="tela escondida">
      <h1 class="titulo">✖️ Tabuada</h1>
      <p class="subtitulo">Tabuada de qual número?</p>
      <div id="grade-numeros" class="grade grade-numeros"></div>
      <button id="botao-voltar-inicio" class="botao-voltar">◀ Trocar matéria</button>
    </section>

    <!-- TELA 3: PERGUNTA -->
    <section id="tela-pergunta" class="tela escondida">
      <div class="barra-topo">
        <span id="info-pergunta" class="info">Pergunta 1 de 10</span>
        <span id="info-pontos" class="info">⭐ 0 pontos</span>
      </div>
      <div class="barra-tempo-fundo">
        <div id="barra-tempo" class="barra-tempo"></div>
      </div>
      <span id="chip-categoria" class="chip">Geral</span>
      <h2 id="texto-pergunta" class="pergunta">A pergunta aparece aqui</h2>
      <div id="alternativas" class="alternativas"></div>
      <p id="feedback" class="feedback"></p>
    </section>

    <!-- TELA 4: RESULTADO -->
    <section id="tela-resultado" class="tela escondida">
      <h1 class="titulo">🎉 Fim de jogo!</h1>
      <p id="mensagem-final" class="subtitulo">Você foi muito bem!</p>
      <p id="pontuacao-final" class="pontuacao-final">0 pontos</p>
      <p id="recorde-final" class="recorde">🏆 Recorde: 0 pontos</p>
      <button id="botao-jogar-novamente" class="botao botao-grande">Jogar de novo 🔁</button>
      <button id="botao-trocar-materia" class="botao-voltar">◀ Trocar matéria</button>
    </section>

  </main>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
